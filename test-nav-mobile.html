<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Navegación Móvil</title>
    <link rel="stylesheet" href="css/styles.min.css">
    <style>
        body {
            background: #1a1a1a;
            padding: 20px;
        }
        .test-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 10000;
        }
        .test-info h3 {
            color: #4CAF50;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="test-info">
        <h3>🔍 Test Info</h3>
        <p>Ancho: <span id="width"></span>px</p>
        <p>Botón visible: <span id="btnVisible"></span></p>
        <p>Menú activo: <span id="menuActive"></span></p>
    </div>

    <header class="site-header" id="SITE_HEADER">
        <nav class="nav-container">
            <ul class="nav-menu" id="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link active">INICIO</a>
                </li>
                <li class="nav-item">
                    <a href="cotizador.html" class="nav-link">COTIZADOR</a>
                </li>
                <li class="nav-item">
                    <a href="blog.html" class="nav-link">BLOG</a>
                </li>
            </ul>

            <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Abrir menú">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <script src="js/navigation.min.js"></script>
    <script>
        function updateTestInfo() {
            const toggle = document.getElementById('mobile-menu-toggle');
            const menu = document.getElementById('nav-menu');
            const width = window.innerWidth;
            
            document.getElementById('width').textContent = width;
            document.getElementById('btnVisible').textContent = 
                window.getComputedStyle(toggle).display !== 'none' ? '✅ SÍ' : '❌ NO';
            document.getElementById('menuActive').textContent = 
                menu.classList.contains('active') ? '✅ SÍ' : '❌ NO';
        }
        
        setInterval(updateTestInfo, 500);
        window.addEventListener('resize', updateTestInfo);
        updateTestInfo();
    </script>
</body>
</html>

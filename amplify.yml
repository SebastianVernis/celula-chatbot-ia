version: 1
backend:
  phases:
    build:
      commands:
        - echo "🔧 Building serverless functions..."
        - cd amplify/functions/chatbot && npm install --production && cd ../../..
        - cd amplify/functions/send-email && npm install --production && cd ../../..
        - echo "✅ Functions built successfully"
frontend:
  phases:
    preBuild:
      commands:
        - echo "📦 Pre-build phase..."
        - node --version
        - npm --version
        - echo "🔍 Checking environment variables..."
        - echo "GEMINI_API_KEY configured:" ${GEMINI_API_KEY:+YES}
        - echo "RESEND_API_KEY configured:" ${RESEND_API_KEY:+YES}
        - echo "CONTACT_EMAIL:" ${CONTACT_EMAIL:-NOT_SET}
        - echo "Installing dependencies..."
        - npm ci
    build:
      commands:
        - echo "🏗️  Building frontend..."
        - npm run build
        - echo "📊 Checking dist contents..."
        - ls -la dist/
    postBuild:
      commands:
        - echo "✅ Build complete"
        - ls -la dist/
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - amplify/functions/chatbot/node_modules/**/*
      - amplify/functions/send-email/node_modules/**/*

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Lightbox</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { padding: 60px 20px; background: #000; }
        .test-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .test-gallery img { width: 100%; cursor: pointer; border: 2px solid #fff; }
    </style>
</head>
<body>
    <h1 style="color: #fff; text-align: center;">Test Lightbox - Galería</h1>
    
    <div id="galeriaGrid" class="test-gallery">
        <div class="galeria-item"><img src="assets/gallery/banda-1.webp" alt="Test 1"></div>
        <div class="galeria-item"><img src="assets/gallery/banda-2.webp" alt="Test 2"></div>
        <div class="galeria-item"><img src="assets/gallery/banda-3.webp" alt="Test 3"></div>
    </div>

    <script src="js/galeria-lightbox.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Mobile Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
        }
        
        .debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 10000;
            max-width: 90%;
        }
        
        .debug-info h3 {
            margin-bottom: 10px;
            color: #4CAF50;
        }
        
        .debug-info p {
            margin: 5px 0;
        }
        
        .test-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }
        
        .test-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        .test-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 3;
        }
        
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        
        .content h1 {
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <div class="debug-info" id="debugInfo">
        <h3>🔍 Debug Info</h3>
        <p id="deviceType">Device: ...</p>
        <p id="orientation">Orientation: ...</p>
        <p id="screenSize">Screen: ...</p>
        <p id="userAgent">UA: ...</p>
        <p id="imageStatus">Image: ...</p>
        <p id="videoStatus">Video: ...</p>
    </div>
    
    <div class="test-container">
        <img id="testImage" class="test-image" alt="Background">
        <video id="testVideo" class="test-video" autoplay muted loop playsinline webkit-playsinline>
            <source id="videoSource" type="video/webm">
        </video>
        <div class="overlay"></div>
    </div>
    
    <div class="content">
        <h1>Test Mobile Background</h1>
    </div>
    
    <script>
        // Detectar dispositivo y orientación
        function getDeviceInfo() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const orientation = height > width ? 'portrait' : 'landscape';
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            return {
                width,
                height,
                orientation,
                isMobile,
                deviceType: isMobile && width <= 768 ? 'mobile' : 'desktop'
            };
        }
        
        // Actualizar debug info
        function updateDebugInfo() {
            const info = getDeviceInfo();
            
            document.getElementById('deviceType').textContent = `Device: ${info.deviceType}`;
            document.getElementById('orientation').textContent = `Orientation: ${info.orientation}`;
            document.getElementById('screenSize').textContent = `Screen: ${info.width}x${info.height}`;
            document.getElementById('userAgent').textContent = `UA: ${navigator.userAgent.substring(0, 50)}...`;
            
            return info;
        }
        
        // Cargar recursos según dispositivo
        function loadResources() {
            const info = updateDebugInfo();
            const testImage = document.getElementById('testImage');
            const testVideo = document.getElementById('testVideo');
            const videoSource = document.getElementById('videoSource');
            
            // Seleccionar imagen y video según dispositivo
            let imageSrc, videoSrc;
            
            if (info.deviceType === 'mobile' && info.orientation === 'portrait') {
                imageSrc = 'assets/images/mobile-background.webp';
                videoSrc = 'assets/video/mobile-background.webm';
                console.log('📱 Usando recursos MOBILE PORTRAIT');
            } else {
                imageSrc = 'assets/images/background.webp';
                videoSrc = 'assets/video/background-1080p.webm';
                console.log('💻 Usando recursos DESKTOP/LANDSCAPE');
            }
            
            // Cargar imagen
            testImage.src = imageSrc;
            testImage.onload = () => {
                document.getElementById('imageStatus').textContent = `Image: ✅ Loaded (${imageSrc})`;
                console.log('✅ Imagen cargada:', imageSrc);
            };
            testImage.onerror = () => {
                document.getElementById('imageStatus').textContent = `Image: ❌ Error (${imageSrc})`;
                console.error('❌ Error cargando imagen:', imageSrc);
            };
            
            // Cargar video
            videoSource.src = videoSrc;
            testVideo.load();
            
            testVideo.addEventListener('loadeddata', () => {
                document.getElementById('videoStatus').textContent = `Video: ✅ Loaded (${videoSrc})`;
                console.log('✅ Video cargado:', videoSrc);
            });
            
            testVideo.addEventListener('playing', () => {
                document.getElementById('videoStatus').textContent = `Video: ▶️ Playing (${videoSrc})`;
                console.log('▶️ Video reproduciéndose:', videoSrc);
            });
            
            testVideo.addEventListener('error', (e) => {
                document.getElementById('videoStatus').textContent = `Video: ❌ Error (${videoSrc})`;
                console.error('❌ Error cargando video:', videoSrc, e);
            });
            
            // Intentar reproducir
            testVideo.play().catch(err => {
                console.warn('⚠️ Autoplay bloqueado:', err);
                document.getElementById('videoStatus').textContent = `Video: ⚠️ Autoplay blocked`;
            });
        }
        
        // Cargar al inicio
        loadResources();
        
        // Recargar al cambiar orientación
        window.addEventListener('resize', () => {
            console.log('🔄 Orientación cambiada');
            loadResources();
        });
        
        // Intentar reproducir al tocar la pantalla
        document.addEventListener('touchstart', () => {
            const testVideo = document.getElementById('testVideo');
            testVideo.play().catch(err => {
                console.warn('⚠️ No se pudo reproducir después del toque:', err);
            });
        }, { once: true });
    </script>
</body>
</html>

        /* Critical CSS - Above the fold */
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%;font-family:'Open Sans',Arial,sans-serif;background:transparent;color:#fff;overflow-x:hidden;scroll-behavior:smooth}

        .site-header{position:fixed;top:0;left:0;right:0;height:var(--header-height);background:rgba(0,0,0,.4);backdrop-filter:blur(10px);z-index:10000;display:flex;align-items:center;justify-content:center}
        .nav-container{width:100%;max-width:980px;padding:0 20px;display:flex;justify-content:center;position:relative}
        .nav-menu{display:flex;list-style:none;gap:40px;align-items:center}
        .nav-link{color:var(--primary-text);text-decoration:none;font-weight:bold;font-size:15px;padding:10px 15px;border-radius:5px;transition:all .3s ease;display:block}
        .nav-link:hover,.nav-link.active{color:var(--secondary-text);background:rgba(255,255,255,.1)}
        
        .hero-section{position:relative;height:100vh;width:100vw;margin:0;padding:0;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
        .hero-video-container{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;overflow:hidden}
        .hero-background-video{position:absolute;top:50%;left:50%;min-width:100%;width:100vw;height:100vh;z-index:1;transform:translate(-50%,-50%);object-fit:cover;object-position:center}
        .hero-video-container .video-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:2;pointer-events:none}
        
        .hero-content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;max-width:800px;text-align:center}
        .hero-logo{width:390px;height:220px;margin-bottom:20px;object-fit:contain}
        .hero-title{font-family:'Lobster',cursive;font-size:19px;margin-bottom:30px;color:var(--primary-text)}
        
        .social-bar{display:flex;gap:10px;justify-content:center;margin-top:20px}
        .social-icon{width:39px;height:39px;border-radius:50%;transition:transform .3s ease}
        
        .mobile-menu-toggle{display:none;flex-direction:column;background:none;border:none;cursor:pointer;padding:10px;position:absolute;right:20px;top:50%;transform:translateY(-50%);z-index:10001}
        .mobile-menu-toggle span{width:25px;height:3px;background:var(--primary-text);margin:3px 0;transition:.3s;display:block}
        
        @media (max-width:768px){
            .mobile-menu-toggle{display:flex}
            .nav-menu{flex-direction:column;gap:10px;background:rgba(0,0,0,.95);backdrop-filter:blur(10px);position:absolute;top:100%;left:0;right:0;padding:20px;opacity:0;visibility:hidden;max-height:0;overflow:hidden;transition:all .3s ease;z-index:9999}
            .nav-menu.active{display:flex;opacity:1;visibility:visible;max-height:500px}
            .hero-logo{width:280px;height:158px}
            .hero-title{font-size:16px}
        }
        
        @media (max-width:480px){
            .hero-logo{width:240px;height:135px}
        }

version: 0.2
phases:
  pre_build:
    commands:
      - echo "Pre-build phase started on `date`"
      - echo "Node.js version:"
      - node --version
      - echo "NPM version:"
      - npm --version
      - echo "Installing dependencies..."
      - npm ci
      - echo "Running pre-build validations..."
      - npm run lint:js || echo "JavaScript linting completed with warnings"
      - echo "Pre-build phase completed"
  build:
    commands:
      - echo "Build phase started on `date`"
      - echo "Creating distribution directory..."
      - mkdir -p dist
      - echo "Copying assets..."
      - cp -r assets dist/
      - cp -r css dist/
      - cp -r js dist/
      - cp -r post dist/
      - cp -r functions dist/
      - cp -r widgets dist/ || echo "No widgets directory found"
      - cp *.html dist/ || echo "No HTML files found"
      - cp *.json dist/ || echo "No JSON files found"
      - cp *.xml dist/ || echo "No XML files found"
      - cp *.txt dist/ || echo "No TXT files found"
      - cp _headers dist/ || echo "No _headers file found"
      - cp manifest.json dist/ || echo "No manifest.json found"
      - echo "Validating video background paths..."
      - find dist/post -name "*.html" -exec grep -l "video-background" {} \; | wc -l
      - echo "Build phase completed"
  post_build:
    commands:
      - echo "Post-build phase started on `date`"
      - echo "Final directory structure:"
      - ls -la dist/
      - echo "Checking critical files:"
      - ls -la dist/assets/video/ || echo "Video directory not found"
      - ls -la dist/js/video-background* || echo "Video background scripts not found"
      - echo "Post-build phase completed"
artifacts:
  files:
    - '**/*'
  base-directory: dist
cache:
  paths:
    - node_modules/**/*